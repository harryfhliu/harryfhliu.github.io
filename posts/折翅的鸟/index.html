<p>折翅的鸟儿</p>
<p>只能双脚驻足着眺望</p>
<p>哪管还曾有过</p>
<p>远在天边的梦想</p>
<hr>
<p>它凝视着蓝天</p>
<p>只见那雁过成行</p>
<p>似乎忘了自己的</p>
<p>天赋也是飞翔</p>
<hr>
<p>折翅的鸟儿</p>
<p>不敢再有那么多奢望</p>
<p>也不去怀念那些</p>
<p>俯瞰地面的时光</p>
<hr>
<p>它不必再用翅膀</p>
<p>去揣摩来风的方向</p>
<p>它只在乎脚下</p>
<p>能不能找到今天的口粮</p>
<hr>
