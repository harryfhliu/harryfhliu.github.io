<p>何须远市觅通津，一线山川入大秦</p>
<p>泉响半池龙变化，松高千嶂鹤精神</p>
<p>人家鸡犬皆成幻，世路风波尽是尘</p>
<p>更有幽亭在碧海，凭阑不语但伤春</p>
