<p>瓶中花
瓶中花
不曾经历春秋冬夏
只求半瓶清澈的水
你也能吐蕊发芽</p>
<p>一枝枝排在瓶口
也凑出一种繁华
没有骄阳的炙晒
也没有风吹雨打</p>
<p>你终了一生只为了
别人漫不经心的观察</p>
