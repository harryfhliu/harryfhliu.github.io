<p>曾经</p>
<p>你肩膀的高度</p>
<p>是我难以企及的山巅</p>
<p>你却让自己的肩头</p>
<p>变成哄我入睡的摇篮</p>
<p>曾经</p>
<p>你稳健的步伐</p>
<p>是我追赶不上步点</p>
<p>你却故意放慢速度</p>
<p>让我自在的奔在你的身前</p>
<p>曾经</p>
<p>你还青春洋溢</p>
<p>未生华发</p>
<p>而如今却开始放任</p>
<p>岁月在你脸上的刻划</p>
<p>曾经</p>
<p>你的谆谆教诲</p>
<p>让我畅想终会离家</p>
<p>而如今我只能</p>
<p>在电话的一端喊你一声</p>
<p>爸爸</p>
<p>父亲节写给在家乡的父母，愿他们多一点快乐，少一点对我的牵挂。</p>  </article> <div class="article-footer"> <a href="/" style="font-size:14px">← 返回首页</a> </div>  <footer class="site-footer"> <div>© 2026 如是我闻 · 由 Astro 构建</div> </footer> <script type="module">const e=document.getElementById("site-search");e&&e.addEventListener("keydown",t=>{t.key==="Enter"&&e.value.trim()&&(window.location.href=`/tags/?q=${encodeURIComponent(e.value.trim())}`)});const n=window.location.pathname;document.querySelectorAll("[data-nav]").forEach(t=>{const a=t.getAttribute("data-nav");(a==="home"?n==="/":n.startsWith(`/${a}`))&&t.classList.add("active")});</script> </body> </html>
