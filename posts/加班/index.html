<p>手指敲击键盘
时钟已过八点
屏幕上跳动的光标
消失了又出现</p>
<p>翻来覆去
删除了又重填
没有哪句话
能表达全面</p>
<p>提交终稿的deadline

<p>只得冲一杯咖啡
