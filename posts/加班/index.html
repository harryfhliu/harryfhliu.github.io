<p>手指敲击键盘
时钟已过八点
屏幕上跳动的光标
消失了又出现</p>
<p>翻来覆去
删除了又重填
没有哪句话
能表达全面</p>
<p>提交终稿的deadline
眼瞅就到跟前
燃烧的脑细胞
也即将用完</p>
<p>只得冲一杯咖啡
把仅剩的精力榨干
实在整不利索
明天继续加班！</p>
