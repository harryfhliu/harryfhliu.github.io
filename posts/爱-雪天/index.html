<p>雪花在窗外
不紧不慢地飘散
时间也跟着
一秒一秒变得缓慢
让我想起了从前
在雪天和你肩并着肩
将两排镌刻名字的脚印
留在身后的地面</p>
<p>雪是你的名字
所以我爱上了雪天
触手可及的寒冷
难抑我内心的温暖
如果爱本身
是一场飞雪中的考验
我情愿牵着你
直到永远</p>
