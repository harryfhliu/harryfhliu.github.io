<p>我才发现那落地的</p>
<p>不是秋叶的黄</p>
<p>那只是一簇一簇</p>
<p>被夏遗落的芬芳</p>
<p>我在树荫遮蔽的道上</p>
<p>小心地躲避着漏下的光亮</p>
<p>躲避着每一滴</p>
<p>从太阳投射的热量</p>
<p>原来我只是将</p>
<p>秋天的外套穿在了身上</p>
<p>却把整个秋天</p>
<p>落在了故乡</p>
<p>当然还包括让我现在</p>
<p>有点想念的</p>
<p>那一抹凉</p>
<p>……</p>
<p>2017年09月18日</p>  </article> <div class="article-footer"> <a href="/" style="font-size:14px">← 返回首页</a> </div>  <footer class="site-footer"> <div>© 2026 如是我闻 · 由 Astro 构建</div> </footer> <script type="module">const e=document.getElementById("site-search");e&&e.addEventListener("keydown",t=>{t.key==="Enter"&&e.value.trim()&&(window.location.href=`/tags/?q=${encodeURIComponent(e.value.trim())}`)});const n=window.location.pathname;document.querySelectorAll("[data-nav]").forEach(t=>{const a=t.getAttribute("data-nav");(a==="home"?n==="/":n.startsWith(`/${a}`))&&t.classList.add("active")});</script> </body> </html>
