<p>一日下班后回到住处，解下背包拿出电脑，坐在椅子上，准备继续工作。偶然看到码在书架上的书，突然借的好久未看自己喜欢的书了。那些专业书，那些哲学、文学的书，还有几本买来未拆封的东野圭吾，让我感觉有一点点无奈。以前时间大把的时候，惶惶虚度，现在难觅悠闲，只能挤出一点点时间学学英语，完全没有时间做自己喜欢的事情。</p>
<p>多希望有一段忘记工作的时间啊，让我整理一下我凌乱的大脑，让我心平气和地读完一本小说。</p>  </article> <div class="article-footer"> <a href="/" style="font-size:14px">← 返回首页</a> </div>  <footer class="site-footer"> <div>© 2026 如是我闻 · 由 Astro 构建</div> </footer> <script type="module">const e=document.getElementById("site-search");e&&e.addEventListener("keydown",t=>{t.key==="Enter"&&e.value.trim()&&(window.location.href=`/tags/?q=${encodeURIComponent(e.value.trim())}`)});const n=window.location.pathname;document.querySelectorAll("[data-nav]").forEach(t=>{const a=t.getAttribute("data-nav");(a==="home"?n==="/":n.startsWith(`/${a}`))&&t.classList.add("active")});</script> </body> </html>
